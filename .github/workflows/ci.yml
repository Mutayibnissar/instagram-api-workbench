name: Workbench CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workbench-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests and OpenAPI validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax-check browser workspace script
        run: node --check live.mjs
      - name: Run unit and security regression tests
        run: npm test
      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Run desktop/mobile browser smoke test
        run: npm run test:ui
      - name: Validate OpenAPI and evidence catalog
        run: npm run validate
      - name: Generate offline route evidence audit
        run: |
          npm run audit:routes
          node route-audit.mjs --full > route-evidence-audit.md
          node route-audit.mjs --full --needs-review > route-review-queue.md
          node route-audit.mjs --full --writes-only > route-write-operations.md
      - name: Upload route evidence report
        uses: actions/upload-artifact@v7
        with:
          name: route-evidence-audit
          path: |
            api/route-evidence-audit.md
            api/route-review-queue.md
            api/route-write-operations.md
          if-no-files-found: error
          retention-days: 14
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  python-tests:
    name: Python extraction tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run synthetic DEX-tracking regressions
        working-directory: api/bulk-trace
        run: python -m unittest -v test_extract.py
